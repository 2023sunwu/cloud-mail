name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# === 以下是解开的配置 ===
[[d1_databases]]
binding = "db"
database_name = "cloudmail"
database_id = "269856d1-64ec-4f1f-ab20-050e25123e60"

[[kv_namespaces]]
binding = "kv"
id = "f947347ea1394b699363cfd44fded973"
# ========================

#[[r2_buckets]]
#binding = "r2"
#bucket_name = ""

#[[send_email]]
#name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
# 这里需要确认你的环境变量
# domain = ["你的邮箱域名"]
# admin = "你的管理员账号"
# jwt_secret = "你的密钥"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
